name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portfolio HTML
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static portfolio checks
        run: python scripts/validate_portfolio.py

  pages-state:
    name: Detect GitHub Pages publishing source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Detect workflow-based or branch-based Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          echo "Detected GitHub Pages build_type: $build_type"
          if [ "$build_type" = "workflow" ]; then
            echo "mode=workflow" >> "$GITHUB_OUTPUT"
            echo "The repository uses GitHub Actions as its Pages source."
          elif [ "$build_type" = "legacy" ]; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "The repository uses branch-based Pages. The gh-pages branch will be kept in sync."
          else
            echo "mode=unknown" >> "$GITHUB_OUTPUT"
            echo "::error::Unsupported GitHub Pages build type: $build_type"
            exit 1
          fi

  deploy-workflow:
    name: Deploy Pages artifact
    needs: [validate, pages-state]
    if: needs.pages-state.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package only the public website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    name: Publish branch-based Pages
    needs: [validate, pages-state]
    if: needs.pages-state.outputs.mode == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package the public website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
