name: Public repository history secret audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/account-secret-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "31 2 * * 1"

permissions:
  contents: read

concurrency:
  group: account-secret-audit
  cancel-in-progress: false

jobs:
  scan:
    name: Scan owned public repository histories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out audit workflow repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan all public repositories owned by the account
        shell: bash
        env:
          OWNER: Hariharans1971
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/repos" "$tmp/reports"
          summary="$tmp/safe-summary.tsv"
          : > "$summary"

          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$OWNER/repos?per_page=100&type=owner&sort=updated" \
            -o "$tmp/repos.json"

          jq -r --arg owner "$OWNER" \
            '.[] | select(.owner.login == $owner and .private == false) | [.full_name, .clone_url] | @tsv' \
            "$tmp/repos.json" > "$tmp/repos.tsv"

          repo_count=0
          empty_count=0
          clone_errors=0
          scan_errors=0
          finding_count=0

          while IFS="$(printf '\t')" read -r full_name clone_url; do
            [ -n "$full_name" ] || continue
            repo_count=$((repo_count + 1))
            short_name="${full_name#*/}"
            safe_name="$(printf '%s' "$short_name" | tr -c 'A-Za-z0-9._-' '_')"
            repo_dir="$tmp/repos/$safe_name.git"
            report="$tmp/reports/$safe_name.json"
            command_log="$tmp/reports/$safe_name.log"

            echo "::group::Scanning $full_name"
            if ! git clone --mirror --quiet "$clone_url" "$repo_dir" 2>/dev/null; then
              echo "Clone failed for $full_name."
              clone_errors=$((clone_errors + 1))
              echo -e "$full_name\tCLONE_ERROR\t\t\t" >> "$summary"
              echo "::endgroup::"
              continue
            fi

            refs="$(git --git-dir="$repo_dir" for-each-ref --format='%(refname)')"
            if [ -z "$refs" ]; then
              echo "Empty repository; no refs to scan."
              empty_count=$((empty_count + 1))
              echo -e "$full_name\tEMPTY\t\t\t" >> "$summary"
              echo "::endgroup::"
              continue
            fi

            scan_status=0
            docker run --rm --network none \
              -v "$repo_dir:/repo:ro" \
              -v "$tmp/reports:/reports" \
              "$GITLEAKS_IMAGE" \
              git --redact --report-format json --report-path "/reports/$safe_name.json" /repo \
              >"$command_log" 2>&1 || scan_status=$?

            if [ ! -f "$report" ]; then
              echo "Scanner produced no JSON report (exit $scan_status)."
              scan_errors=$((scan_errors + 1))
              echo -e "$full_name\tSCAN_ERROR\t\t\t" >> "$summary"
              echo "::endgroup::"
              continue
            fi

            count="$(jq 'length' "$report")"
            if [ "$count" -gt 0 ]; then
              finding_count=$((finding_count + count))
              echo "$count possible finding(s) (values are redacted; only locations will be summarized)."
              while IFS="$(printf '\t')" read -r rule path commit line; do
                echo -e "$full_name\t$rule\t$path\t$commit\t$line" >> "$summary"
              done < <(jq -r '.[] | [(.RuleID // "unknown"), (.File // "unknown"), ((.Commit // "unknown")[:12]), ((.StartLine // 0)|tostring)] | @tsv' "$report")
            elif [ "$scan_status" -ne 0 ]; then
              echo "Scanner exited with $scan_status despite an empty report."
              scan_errors=$((scan_errors + 1))
              echo -e "$full_name\tSCAN_ERROR\t\t\t" >> "$summary"
            else
              echo "No findings reported."
              echo -e "$full_name\tCLEAN\t\t\t" >> "$summary"
            fi
            echo "::endgroup::"
          done < "$tmp/repos.tsv"

          {
            echo "## Public repository history secret audit"
            echo
            echo "- Owner: $OWNER"
            echo "- Public repositories considered: $repo_count"
            echo "- Empty repositories skipped: $empty_count"
            echo "- Clone errors: $clone_errors"
            echo "- Scanner errors: $scan_errors"
            echo "- Total Gitleaks findings: $finding_count"
            echo
            echo "The scan covers Git history/refs that were fetched by mirror clone. Secret values are not included in this summary."
            echo
            echo "| Repository | Rule | File | Commit | Line |"
            echo "|---|---|---|---|---:|"
            awk -F '\t' '$2 != "CLEAN" && $2 != "EMPTY" && $2 != "CLONE_ERROR" && $2 != "SCAN_ERROR" {printf "| `%s` | `%s` | `%s` | `%s` | %s |\n", $1, $2, $3, $4, $5}' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "Audit totals: repos=$repo_count empty=$empty_count clone_errors=$clone_errors scan_errors=$scan_errors findings=$finding_count"
          if [ "$clone_errors" -gt 0 ] || [ "$scan_errors" -gt 0 ]; then
            echo "Audit incomplete: one or more repositories could not be scanned."
            exit 2
          fi
          if [ "$finding_count" -gt 0 ]; then
            echo "Potential historical findings remain. Review the workflow summary by location, rotate any real credentials, and only then consider history rewriting."
            exit 1
          fi
          echo "No findings reported for the public repositories scanned."
