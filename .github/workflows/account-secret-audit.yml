name: Public repository history secret audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/account-secret-audit.yml"
      - "security/gitleaks-history-allowlist.json"
  workflow_dispatch:
  schedule:
    - cron: "31 2 * * 1"

permissions:
  contents: read

concurrency:
  group: account-secret-audit
  cancel-in-progress: false

jobs:
  scan:
    name: Scan owned public repository histories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out audit workflow and exact-fingerprint allowlist
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all public repositories owned by the account
        shell: bash
        env:
          OWNER: Hariharans1971
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          out_dir="$GITHUB_WORKSPACE/audit-output"
          rm -rf "$out_dir"
          mkdir -p "$tmp/repos" "$tmp/reports" "$out_dir"
          summary="$out_dir/safe-summary.tsv"
          : > "$summary"
          allowlist="$GITHUB_WORKSPACE/security/gitleaks-history-allowlist.json"
          jq -e 'type == "array" and all(.[]; (.repo|type)=="string" and (.rule|type)=="string" and (.path|type)=="string" and (.commit|type)=="string" and (.line|type)=="number")' "$allowlist" >/dev/null

          # Paginate the account endpoint so repositories beyond page one are included.
          page=1
          while :; do
            response="$tmp/repos-page-$page.json"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/repos?per_page=100&type=owner&sort=updated&page=$page" \
              -o "$response"
            page_count="$(jq 'length' "$response")"
            [ "$page_count" -gt 0 ] || break
            jq -s 'add' "$tmp"/repos-page-*.json > "$tmp/repos-all.json"
            page=$((page + 1))
            [ "$page" -le 50 ] || { echo "Repository pagination safety limit reached."; exit 2; }
            [ "$page_count" -eq 100 ] || break
          done

          jq -r --arg owner "$OWNER" \
            '.[] | select(.owner.login == $owner and .private == false) | [.full_name, .clone_url] | @tsv' \
            "$tmp/repos-all.json" > "$tmp/repos.tsv"

          repo_count=0
          empty_count=0
          clone_errors=0
          scan_errors=0
          finding_count=0
          suppressed_count=0

          while IFS=$'\t' read -r full_name clone_url; do
            [ -n "$full_name" ] || continue
            repo_count=$((repo_count + 1))
            short_name="${full_name#*/}"
            safe_name="$(printf '%s' "$short_name" | tr -c 'A-Za-z0-9._-' '_')"
            repo_dir="$tmp/repos/$safe_name.git"
            report="$tmp/reports/$safe_name.json"
            safe_report="$out_dir/$safe_name.findings.json"
            command_log="$tmp/reports/$safe_name.log"

            echo "::group::Scanning $full_name"
            if ! git clone --mirror --quiet "$clone_url" "$repo_dir" 2>/dev/null; then
              echo "Clone failed for $full_name."
              clone_errors=$((clone_errors + 1))
              printf '%s\tCLONE_ERROR\t\t\t\n' "$full_name" >> "$summary"
              echo "::endgroup::"
              continue
            fi

            refs="$(git --git-dir="$repo_dir" for-each-ref --format='%(refname)')"
            if [ -z "$refs" ]; then
              echo "Empty repository; no refs to scan."
              empty_count=$((empty_count + 1))
              printf '%s\tEMPTY\t\t\t\n' "$full_name" >> "$summary"
              echo "::endgroup::"
              continue
            fi

            scan_status=0
            docker run --rm --network none \
              -v "$repo_dir:/repo:ro" \
              -v "$tmp/reports:/reports" \
              "$GITLEAKS_IMAGE" \
              git --redact --report-format json --report-path "/reports/$safe_name.json" /repo \
              >"$command_log" 2>&1 || scan_status=$?

            if [ ! -f "$report" ]; then
              echo "Scanner produced no JSON report (exit $scan_status)."
              scan_errors=$((scan_errors + 1))
              printf '%s\tSCAN_ERROR\t\t\t\n' "$full_name" >> "$summary"
              echo "::endgroup::"
              continue
            fi

            raw_count="$(jq 'length' "$report")"
            if [ "$scan_status" -gt 1 ] || { [ "$scan_status" -ne 0 ] && [ "$raw_count" -eq 0 ]; }; then
              echo "Scanner error (exit $scan_status; report entries $raw_count)."
              scan_errors=$((scan_errors + 1))
              printf '%s\tSCAN_ERROR\t\t\t\n' "$full_name" >> "$summary"
              echo "::endgroup::"
              continue
            fi

            # Suppress only exact, reviewed repo+rule+path+commit+line tuples.
            # This is post-processing: the upstream findings are still scanned.
            jq --arg repo "$full_name" --slurpfile allowlist "$allowlist" '
              def key($repo; $rule; $path; $commit; $line):
                [$repo, $rule, $path, $commit, ($line | tostring)] | @json;
              [ $allowlist[0][] | key(.repo; .rule; .path; .commit; .line) ] as $keys
              | [
                  .[] as $f
                  | select(($keys | index(key($repo; $f.RuleID; $f.File; $f.Commit; $f.StartLine))) == null)
                  | {
                      RuleID: $f.RuleID,
                      Description: $f.Description,
                      File: $f.File,
                      Commit: $f.Commit,
                      StartLine: $f.StartLine,
                      EndLine: $f.EndLine,
                      Tags: $f.Tags
                    }
                ]
            ' "$report" > "$safe_report"

            filtered_count="$(jq 'length' "$safe_report")"
            suppressed=$((raw_count - filtered_count))
            suppressed_count=$((suppressed_count + suppressed))

            if [ "$filtered_count" -gt 0 ]; then
              finding_count=$((finding_count + filtered_count))
              echo "$filtered_count unsuppressed finding(s); raw secret values are excluded from the artifact."
              while IFS=$'\t' read -r rule path commit line; do
                printf '%s\t%s\t%s\t%s\t%s\n' "$full_name" "$rule" "$path" "$commit" "$line" >> "$summary"
              done < <(jq -r '.[] | [(.RuleID // "unknown"), (.File // "unknown"), ((.Commit // "unknown")[:12]), ((.StartLine // 0)|tostring)] | @tsv' "$safe_report")
            else
              printf '%s\tCLEAN\t\t\t\n' "$full_name" >> "$summary"
              if [ "$suppressed" -gt 0 ]; then
                echo "$suppressed exact inherited upstream fixture finding(s) suppressed after scan."
              elif [ "$raw_count" -eq 0 ]; then
                echo "No findings reported."
              fi
            fi
            echo "::endgroup::"
          done < "$tmp/repos.tsv"

          {
            echo "## Public repository history secret audit"
            echo
            echo "- Owner: $OWNER"
            echo "- Public repositories considered: $repo_count"
            echo "- Empty repositories skipped: $empty_count"
            echo "- Clone errors: $clone_errors"
            echo "- Scanner errors: $scan_errors"
            echo "- Unsuppressed Gitleaks findings: $finding_count"
            echo "- Exact inherited upstream fixture findings suppressed after scanning: $suppressed_count"
            echo
            echo "Secret values are not included in this summary or uploaded allow-listed JSON reports. Suppressions require exact repository, rule, path, full commit SHA, and line match."
            echo
            echo "| Repository | Rule | File | Commit | Line |"
            echo "|---|---|---|---|---:|"
            while IFS=$'\t' read -r repo rule path commit line; do
              case "$rule" in CLEAN|EMPTY|CLONE_ERROR|SCAN_ERROR) continue ;; esac
              printf '| `%s` | `%s` | `%s` | `%s` | %s |\n' "$repo" "$rule" "$path" "$commit" "$line"
            done < "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Audit totals: repos=$repo_count empty=$empty_count clone_errors=$clone_errors scan_errors=$scan_errors findings=$finding_count inherited_suppressed=$suppressed_count"
          if [ "$clone_errors" -gt 0 ] || [ "$scan_errors" -gt 0 ]; then
            echo "Audit incomplete: one or more repositories could not be scanned."
            exit 2
          fi
          if [ "$finding_count" -gt 0 ]; then
            echo "Potential secrets or unexplained findings remain. Review sanitized locations, revoke any real credentials, and only then run the guarded history-sanitization workflows."
            exit 1
          fi
          echo "No unsuppressed findings reported for the public repositories scanned."

      - name: Upload sanitized audit locations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-history-secret-audit-locations
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
